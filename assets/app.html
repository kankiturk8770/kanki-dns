<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل DNS</title>
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#5b6b7a;--line:#cfd7de;--card:#fff;--acc:#1f5eff;--bad:#c62828;--ok:#1b7f4b;--warn:#b26a00;--side:#e2e8ee}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--ink:#e6edf3;--mut:#8b9aa8;--line:#26323d;--card:#17202a;--acc:#6b9bff;--bad:#ff6b6b;--ok:#4cc38a;--warn:#e0a040;--side:#0c1116}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 ui-sans-serif,system-ui,Tahoma,sans-serif}
#shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--side);border-inline-end:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav b{display:block;padding:4px 10px 12px;font-size:16px}
nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
nav a.on{background:var(--acc);color:#fff}
nav a:focus-visible{outline:2px solid var(--acc)}
main{padding:18px;min-width:0}
h1{font-size:19px;margin:0 0 14px}h2{font-size:15px;margin:0 0 8px}
.muted{color:var(--mut)}.err{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
section,.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;border-inline-start:3px solid var(--acc)}
.card b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.card span{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.chart{width:100%;height:150px;color:var(--mut)}
.legend span{margin-inline-end:12px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
input[type=text],input:not([type]),input[type=number],input[type=date],input[type=password],select{min-width:0}
button{cursor:pointer}button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>.grow{flex:1;min-width:140px}
.f{margin-bottom:10px}.f>label{display:block;color:var(--mut);font-size:12.5px;margin-bottom:2px}.f small{color:var(--mut)}
.f input:not([type=checkbox]):not([type=radio]),.f select{width:100%}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;border-top:0;white-space:nowrap}
td.n,.ltr{direction:ltr;unicode-bidi:embed;text-align:left;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.b-active,.b-cache,.b-direct,.b-static{color:var(--ok)}.b-proxy{color:var(--acc)}.b-block,.b-disabled,.b-expired,.b-over_quota,.b-refused,.b-servfail{color:var(--bad)}.b-stale{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--acc)}
.sw{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}.sw small{color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(640px,94vw);max-height:90vh;padding:16px}
dialog::backdrop{background:#0008}
#toast{position:fixed;inset-inline-start:16px;bottom:16px;display:grid;gap:6px;z-index:9}
#toast div{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px}#toast .bad{background:var(--bad);color:#fff}
pre{direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-size:12px;margin:6px 0}
.live{max-height:68vh;overflow:auto}
@media(max-width:820px){#shell{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px}nav b{display:none}nav a{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell"><nav id="nav" aria-label="منو"></nav><main id="main"></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script>
'use strict';
const B = location.pathname.replace(/\/$/, '') + '/api/v1';
let CSRF = '', ME = {};
const $ = (s, r = document) => r.querySelector(s);
const PROPS = new Set(['value', 'checked', 'disabled', 'selected', 'textContent']);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag), props = [];
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (PROPS.has(k)) props.push([k, v]);
    else e.setAttribute(k, v === true ? '' : v);
  }
  e.append(...kids.flat(Infinity).filter(x => x != null && x !== false));
  for (const [k, v] of props) e[k] = v;
  return e;
}
async function api(path, method = 'GET', body) {
  const r = await fetch(B + path, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-CSRF': CSRF }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { location.reload(); throw new Error('session expired'); }
  if (!r.ok) { let m = 'HTTP ' + r.status; try { m = (await r.json()).error || m; } catch (_) {} throw new Error(m); }
  return r.status === 204 ? null : r.json();
}
function toast(msg, bad) { const t = h('div', { class: bad ? 'bad' : '' }, msg); $('#toast').append(t); setTimeout(() => t.remove(), 3500); }
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const num = n => Number(n || 0).toLocaleString('en');
const bytes = n => { n = Number(n || 0); const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i ? 2 : 0) + ' ' + u[i]; };
const dur = s => { const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60); return (d ? d + 'd ' : '') + hh + 'h ' + mm + 'm'; };
const tstr = t => new Date(t * 1000).toLocaleString('fa-IR');
const dstr = t => t ? new Date(t * 1000).toISOString().slice(0, 10) : '';
const QT = { 1: 'A', 2: 'NS', 5: 'CNAME', 6: 'SOA', 12: 'PTR', 15: 'MX', 16: 'TXT', 28: 'AAAA', 33: 'SRV', 64: 'SVCB', 65: 'HTTPS', 255: 'ANY' };
const STATUS = { active: 'فعال', disabled: 'غیرفعال', expired: 'منقضی', over_quota: 'حجم تمام' };
const lines = t => t.split('\n').map(x => x.trim()).filter(Boolean);
const copy = async txt => { try { await navigator.clipboard.writeText(txt); toast('کپی شد'); } catch (_) { prompt('کپی کنید:', txt); } };
const card = (l, v) => h('div', { class: 'card' }, h('b', {}, String(v)), h('span', {}, l));
const badge = (cls, txt) => h('span', { class: 'badge b-' + cls }, txt);
const field = (label, input, hint) => h('div', { class: 'f' }, h('label', {}, label), input, hint ? h('small', {}, hint) : null);
const tbl = (head, rows) => h('div', { class: 'tw' }, h('table', {}, h('thead', {}, h('tr', {}, head.map(x => h('th', {}, x)))), h('tbody', {}, rows)));

function modal(title, content, buttons = []) {
  const d = $('#dlg');
  d.replaceChildren(h('h2', {}, title), content, h('div', { class: 'row', style: 'margin-top:12px;justify-content:flex-end' }, ...buttons, h('button', { onclick: () => d.close() }, 'بستن')));
  d.showModal();
  return d;
}

function lineChart(series, w = 600, ht = 150) {
  const ns = 'http://www.w3.org/2000/svg', n = Math.max(2, ...series.map(s => s.data.length));
  const max = Math.max(1, ...series.flatMap(s => s.data));
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${ht}`); svg.setAttribute('class', 'chart'); svg.setAttribute('preserveAspectRatio', 'none');
  for (const s of series) {
    const d = s.data.map((v, i) => (i ? 'L' : 'M') + (i * w / (n - 1)).toFixed(1) + ' ' + (ht - 4 - v / max * (ht - 16)).toFixed(1)).join('');
    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', s.color); p.setAttribute('stroke-width', '2'); p.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.append(p);
  }
  const t = document.createElementNS(ns, 'text');
  t.setAttribute('x', 4); t.setAttribute('y', 12); t.setAttribute('font-size', '11'); t.setAttribute('fill', 'currentColor'); t.textContent = 'max ' + max;
  svg.append(t);
  return svg;
}
const legend = items => h('div', { class: 'legend' }, items.map(([c, t]) => h('span', {}, h('i', { style: 'background:' + c }), t)));

// ---------- router ----------
const PAGES = {
  dashboard: ['داشبورد', pDash], live: ['کوئری زنده', pLive], clients: ['کاربران', pClients], policies: ['پالیسی‌ها', pPolicies],
  records: ['رکوردهای محلی', pRecords], upstreams: ['آپستریم و کش', pUp], settings: ['تنظیمات', pSettings],
  tls: ['گواهی TLS', pTls], security: ['امنیت', pSec], system: ['پشتیبان و سیستم', pSys]
};
let timers = [], es = null;
function stopAll() { timers.forEach(clearInterval); timers = []; if (es) { es.close(); es = null; } }
async function route() {
  stopAll();
  const k = PAGES[(location.hash || '#dashboard').slice(1)] ? (location.hash || '#dashboard').slice(1) : 'dashboard';
  $('#nav').replaceChildren(h('b', {}, 'DNS Gate'), ...Object.entries(PAGES).map(([id, [t]]) => h('a', { href: '#' + id, class: id === k ? 'on' : '' }, t)),
    h('a', { href: '#', onclick: guard(async ev => { ev.preventDefault(); await api('/logout', 'POST'); location.reload(); }) }, 'خروج'));
  const m = $('#main');
  m.replaceChildren(h('div', { class: 'muted' }, '...'));
  try { await PAGES[k][1](m); } catch (e) { m.replaceChildren(h('div', { class: 'err' }, 'خطا: ' + e.message)); }
}

// ---------- dashboard ----------
async function pDash(m) {
  const root = h('div');
  m.replaceChildren(h('h1', {}, 'داشبورد'), root);
  const topBox = (t, l) => h('div', { class: 'box' }, h('h2', {}, t), l.length ? tbl([], l.map(x => h('tr', {}, h('td', { class: 'ltr' }, x.key), h('td', { class: 'n' }, num(x.count))))) : h('div', { class: 'muted' }, 'داده‌ای نیست'));
  async function load() {
    const [o, s, t] = await Promise.all([api('/overview'), api('/series'), api('/top')]);
    const st = o.stats, last = s[s.length - 1] || {}, tot = st.cache_hits + st.stale_hits + st.direct;
    const col = ['#1f5eff', '#1b7f4b', '#b26a00', '#c62828'];
    root.replaceChildren(
      h('div', { class: 'cards' },
        card('کوئری/ثانیه', last.q || 0), card('کل کوئری', num(st.queries)), card('نرخ کش', (tot ? Math.round(100 * (st.cache_hits + st.stale_hits) / tot) : 0) + '%'),
        card('پروکسی', num(st.proxied)), card('مسدود', num(st.blocked)), card('ردشده', num(st.refused)), card('محدودشده', num(st.limited)),
        card('خطای upstream', num(st.servfail)), card('رله فعال', st.relays_active), card('رله ردشده', num(st.relays_rejected)),
        card('ترافیک ↑', bytes(st.bytes_up)), card('ترافیک ↓', bytes(st.bytes_down)), card('RAM', bytes(o.sys.rss || 0)), card('CPU', (last.cpu || 0) + '%'),
        card('آپتایم', dur(o.uptime)), card('کاربران', o.clients.total), card('ورودی کش', num(o.cache_entries))),
      h('div', { class: 'grid2' },
        h('div', { class: 'box' }, h('h2', {}, 'کوئری در ثانیه (۱۰ دقیقه اخیر)'), lineChart([
          { color: col[0], data: s.map(x => x.q) }, { color: col[1], data: s.map(x => x.hit) }, { color: col[2], data: s.map(x => x.proxy) }, { color: col[3], data: s.map(x => x.block + x.refused) }]),
          legend([[col[0], 'کل'], [col[1], 'کش'], [col[2], 'پروکسی'], [col[3], 'مسدود/ردشده']])),
        h('div', { class: 'box' }, h('h2', {}, 'اتصال‌های رله فعال'), lineChart([{ color: col[0], data: s.map(x => x.relays) }]),
          h('div', { class: 'muted' }, 'load: ' + (o.sys.load ? o.sys.load.join(' / ') : '—') + ' · threads: ' + (o.sys.threads ?? '—')))),
      h('div', { class: 'grid3' }, topBox('دامنه‌های پرتکرار', t.domains), topBox('کاربران فعال', t.clients), topBox('اکشن‌ها', t.actions)),
      h('div', { class: 'box' }, h('h2', {}, 'سرویس‌ها'),
        h('pre', {}, `DNS udp/tcp  ${o.listen.dns}\nDoT          ${o.listen.dot || 'off'}\nSNI relay    ${o.listen.relay}\nHTTP relay   ${o.listen.http_relay || 'off'}\nPanel/DoH    ${o.listen.web}\npublic ip    ${o.listen.public_ip}\nrules        proxy ${num(o.rules.proxied)} · block ${num(o.rules.blocked)} · records ${o.rules.records}\nTLS          ${o.tls.source} ${o.tls.names.join(', ')} ${o.tls.not_after ? 'expires ' + dstr(o.tls.not_after) : ''}\nmode         ${o.allow_all ? 'OPEN (allow_all)' : 'whitelist'}`)));
  }
  await load();
  timers.push(setInterval(() => load().catch(() => {}), 3000));
}

// ---------- live log ----------
async function pLive(m) {
  let paused = false, rows = [];
  const q = h('input', { placeholder: 'فیلتر دامنه/کاربر/اکشن', class: 'grow' }), body = h('tbody');
  const pb = h('button', { onclick: () => { paused = !paused; pb.textContent = paused ? 'ادامه' : 'توقف'; } }, 'توقف');
  const clr = h('button', { onclick: () => { rows = []; draw(); } }, 'پاک کردن');
  m.replaceChildren(h('h1', {}, 'کوئری زنده'), h('div', { class: 'row' }, q, pb, clr), h('div', { class: 'box live' }, h('table', {}, h('thead', {}, h('tr', {}, ['زمان', 'کاربر', 'دامنه', 'نوع', 'اکشن', 'کد', 'ms'].map(x => h('th', {}, x)))), body)));
  const row = e => h('tr', {}, h('td', { class: 'n' }, new Date(e.t).toLocaleTimeString('en-GB')), h('td', {}, e.client || h('span', { class: 'ltr' }, e.ip)), h('td', { class: 'ltr' }, e.name), h('td', {}, QT[e.qtype] || e.qtype), h('td', {}, badge(e.action, e.action)), h('td', {}, e.rcode), h('td', { class: 'n' }, (e.us / 1000).toFixed(1)));
  const match = e => { const s = q.value.trim().toLowerCase(); return !s || (e.name + ' ' + e.action + ' ' + (e.client || '') + ' ' + e.ip).toLowerCase().includes(s); };
  function draw() { body.replaceChildren(...rows.filter(match).slice(0, 400).map(row)); }
  q.addEventListener('input', draw);
  rows = await api('/logs?limit=300');
  draw();
  es = new EventSource(B + '/stream');
  es.onmessage = ev => { if (paused) return; rows.unshift(JSON.parse(ev.data)); if (rows.length > 800) rows.length = 800; draw(); };
}

// ---------- clients ----------
const portalUrl = c => location.origin + '/sub/' + c.token;
const dohUrl = c => location.origin + '/dns-query/' + c.doh_token;
function shareText(c, secret) {
  return `${c.name}\nپورتال: ${portalUrl(c)}\nDNS: ${ME.public_ip}\nDoH: ${dohUrl(c)}` + (secret ? `\nرمز ثبت IP: ${secret}` : '');
}
function showShare(c, secret) {
  const t = shareText(c, secret);
  modal('اطلاعات اشتراک', h('div', {}, secret ? h('div', { class: 'warn' }, 'رمز ثبت IP فقط همین یک بار نمایش داده می‌شود.') : null, h('pre', {}, t)), [h('button', { class: 'p', onclick: () => copy(t) }, 'کپی')]);
}
async function clientForm(c) {
  const pre = await api('/presets');
  const v = c || { name: '', note: '', ips: [], max_ips: 1, enabled: true, expires_at: null, quota_bytes: 0, presets: null, custom_proxied: [], custom_blocked: [] };
  const name = h('input', { value: v.name, maxlength: 64 }), note = h('input', { value: v.note }), en = h('input', { type: 'checkbox', checked: v.enabled });
  const ips = h('textarea', { rows: 2, dir: 'ltr', value: v.ips.join('\n') }), max = h('input', { type: 'number', min: 1, max: 16, value: v.max_ips });
  const exp = h('input', { type: 'date', value: dstr(v.expires_at) }), q = h('input', { type: 'number', min: 0, step: '0.1', value: +(v.quota_bytes / 1073741824).toFixed(3) });
  const all = h('input', { type: 'radio', name: 'pm', checked: v.presets === null }), sel = h('input', { type: 'radio', name: 'pm', checked: v.presets !== null });
  const boxes = pre.map(p => ({ p, cb: h('input', { type: 'checkbox', checked: v.presets ? v.presets.includes(p.name) : p.enabled }) }));
  const cp = h('textarea', { rows: 2, dir: 'ltr', value: v.custom_proxied.join('\n') }), cb = h('textarea', { rows: 2, dir: 'ltr', value: v.custom_blocked.join('\n') });
  const days = n => { exp.value = dstr(Math.floor(Date.now() / 1000) + n * 86400); };
  const el = h('div', {},
    h('div', { class: 'row' }, h('div', { class: 'grow' }, field('نام', name)), h('div', { class: 'grow' }, field('یادداشت', note)), h('label', {}, en, ' فعال')),
    h('div', { class: 'row' }, h('div', { class: 'grow' }, field('IPها (هر خط یکی)', ips)), h('div', {}, field('حداکثر IP', max))),
    h('div', { class: 'row' }, h('div', { class: 'grow' }, field('انقضا', exp, 'خالی = نامحدود')), h('button', { onclick: () => days(30) }, '+۳۰ روز'), h('button', { onclick: () => days(90) }, '+۹۰ روز'), h('button', { onclick: () => { exp.value = ''; } }, 'نامحدود'),
      h('div', { class: 'grow' }, field('سقف حجم (GB)', q, '۰ = نامحدود'))),
    h('div', { class: 'f' }, h('label', {}, 'پالیسی‌های این کاربر'), h('label', {}, all, ' همه پالیسی‌های فعال سراسری '), h('label', {}, sel, ' فقط انتخابی'),
      h('div', { style: 'max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:6px' }, boxes.map(({ p, cb }) => h('label', { style: 'display:block' }, cb, ' ' + p.title)))),
    h('div', { class: 'row' }, h('div', { class: 'grow' }, field('دامنه‌های اضافه برای پروکسی', cp)), h('div', { class: 'grow' }, field('دامنه‌های مسدود', cb))));
  const get = () => ({
    name: name.value.trim(), note: note.value, enabled: en.checked, ips: lines(ips.value), max_ips: +max.value || 1,
    expires_at: exp.value ? Math.floor(new Date(exp.value + 'T23:59:59').getTime() / 1000) : null, quota_bytes: Math.round((+q.value || 0) * 1073741824),
    presets: sel.checked ? boxes.filter(x => x.cb.checked).map(x => x.p.name) : null, custom_proxied: lines(cp.value), custom_blocked: lines(cb.value)
  });
  return { el, get };
}
async function pClients(m) {
  let list = [], text = '', stf = '';
  const body = h('div'), s = h('input', { placeholder: 'جستجو نام/IP/یادداشت', class: 'grow' }), sf = h('select', {}, h('option', { value: '' }, 'همه وضعیت‌ها'), ...Object.entries(STATUS).map(([k, t]) => h('option', { value: k }, t)));
  s.addEventListener('input', () => { text = s.value.trim().toLowerCase(); draw(); });
  sf.addEventListener('change', () => { stf = sf.value; draw(); });
  m.replaceChildren(h('h1', {}, 'کاربران'), h('div', { class: 'row' }, s, sf,

    h('section', {}, h('h2', {}, 'IPهای قفل‌شده'), lk.length ? tbl(['IP', 'تلاش', 'زمان باقی‌مانده'], lk.map(l => h('tr', {}, h('td', { class: 'ltr' }, l.ip), h('td', {}, l.fails), h('td', {}, Math.ceil(l.retry_secs / 60) + ' دقیقه')))) : h('div', { class: 'muted' }, 'موردی نیست'),
      lk.length ? h('button', { onclick: guard(async () => { await api('/lockouts/clear', 'POST'); route(); }) }, 'آزاد کردن همه') : null),
    h('section', {}, h('h2', {}, 'گزارش رویدادها'), tbl(['زمان', 'IP', 'رویداد', 'جزئیات'], au.slice(0, 200).map(a => h('tr', {}, h('td', {}, tstr(a.t)), h('td', { class: 'ltr' }, a.ip), h('td', { class: 'ltr' }, a.action), h('td', { class: 'ltr' }, a.detail))))));
  totpUi();
}
